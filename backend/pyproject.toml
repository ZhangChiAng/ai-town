[project]
name = "ai-town-backend"
version = "0.1.0"
description = "FastAPI backend for the AI Town experiment"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.116.1,<1.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0,<3.0.0",
    "pytest>=9.0.0,<10.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
